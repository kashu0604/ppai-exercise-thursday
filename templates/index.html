<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Students</title>
  </head>
  <body>
    <h1>Students</h1>
    {% if averages and averages[0][1] %}
    <h2>Average skill ratings</h2>
    <ul>
      {% for label, value in averages %}
      <li>{{ label }}: {{ value }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% if names %}
    <button type="button" id="shuffle">Shuffle</button>
    <ul id="student-list">
      {% for name in names %}
      <li>{{ name }}</li>
      {% endfor %}
    </ul>
    <script>
      document.getElementById("shuffle").addEventListener("click", function () {
        var list = document.getElementById("student-list");
        var items = Array.from(list.children);
        for (var i = items.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = items[i];
          items[i] = items[j];
          items[j] = temp;
        }
        items.forEach(function (item) {
          list.appendChild(item);
        });
      });
    </script>
    {% else %}
    <p>No students found.</p>
    {% endif %}
  </body>
</html>
